<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Onboarding Entre nous</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:ital,wght@0,400..800;1,400..800&display=swap">
<style>
/* Prototype d'app : un téléphone au centre, le plan du parcours à droite (bureau) ; plein écran sur mobile. Tokens = charte Entre nous. */
:root {
  --papier: #F5F2EC; --craie: #FFFFFF; --graphite: #26252E; --graphite-doux: #63616E; --filet: #E3DED3;
  --rouge: #E1243B; --rouge-texte: #BE1B30; --buvard: #FBDDE1; --on-rouge: #FFFFFF;
  --bleu: #1F2FA8; --bleu-pale: #E2E5FA; --on-bleu: #FFFFFF;
  --beurre: #FFD23F; --beurre-pale: #FFF3C4; --on-beurre: #26252E; --succes: #1A7F4B;
  --fond-page: #E9E5DC; --ombre-billet: 0 1px 0 rgba(38, 37, 46, .05), 0 8px 18px rgba(38, 37, 46, .09);
  --ombre-flottante: 0 12px 32px rgba(38, 37, 46, .18); --voile: rgba(20, 21, 43, .38);
  --sys-feuille: #F2F2F7; --sys-texte: #111111; --sys-gris: #8A8A8E; --sys-bleu: #0A7AFF; --sys-ligne: #D8D8DC;
  --font-display: "Caprasimo", "Cooper Black", Georgia, serif;
  --font-sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1); --ressort: cubic-bezier(.34, 1.4, .64, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papier: #14152B; --craie: #1E2040; --graphite: #F5F2EC; --graphite-doux: #B8B7C8; --filet: #34365A;
    --rouge: #FF6B7D; --rouge-texte: #FF8A98; --buvard: #45202A; --on-rouge: #14152B;
    --bleu: #8A95FF; --bleu-pale: #232A63; --on-bleu: #14152B;
    --beurre: #FFD84F; --beurre-pale: #3A3216; --on-beurre: #26252E; --succes: #4FD08F;
    --fond-page: #0D0E1F; --ombre-billet: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 18px rgba(0, 0, 0, .35);
    --ombre-flottante: 0 12px 32px rgba(0, 0, 0, .5); --voile: rgba(0, 0, 0, .55);
    --sys-feuille: #1C1C1E; --sys-texte: #FFFFFF; --sys-gris: #98989F; --sys-bleu: #0A84FF; --sys-ligne: #38383A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papier: #14152B; --craie: #1E2040; --graphite: #F5F2EC; --graphite-doux: #B8B7C8; --filet: #34365A;
  --rouge: #FF6B7D; --rouge-texte: #FF8A98; --buvard: #45202A; --on-rouge: #14152B;
  --bleu: #8A95FF; --bleu-pale: #232A63; --on-bleu: #14152B;
  --beurre: #FFD84F; --beurre-pale: #3A3216; --on-beurre: #26252E; --succes: #4FD08F;
  --fond-page: #0D0E1F; --ombre-billet: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 18px rgba(0, 0, 0, .35);
  --ombre-flottante: 0 12px 32px rgba(0, 0, 0, .5); --voile: rgba(0, 0, 0, .55);
  --sys-feuille: #1C1C1E; --sys-texte: #FFFFFF; --sys-gris: #98989F; --sys-bleu: #0A84FF; --sys-ligne: #38383A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--fond-page); color: var(--graphite); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--bleu); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

/* ---------- mise en page bureau ---------- */
.stage { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 48px; padding: 24px; }
.device { width: 390px; height: 844px; border-radius: 58px; background: #0B0B10; padding: 12px; position: relative; flex: none; box-shadow: 0 30px 80px rgba(0, 0, 0, .28), inset 0 0 0 2px #2A2A33; transform-origin: center center; }
.device::before { content: ""; position: absolute; top: 22px; left: 50%; width: 118px; height: 34px; margin-left: -59px; border-radius: 20px; background: #0B0B10; z-index: 30; }
.phone { position: relative; width: 100%; height: 100%; border-radius: 46px; overflow: hidden; background: var(--papier); isolation: isolate; }
.sbar { position: absolute; top: 0; left: 0; right: 0; height: 50px; z-index: 25; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 40px; font: 600 15px/1 var(--font-sans); color: var(--graphite); pointer-events: none; }
.sbar svg { display: block; }
.homebar { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--graphite); opacity: .9; z-index: 25; pointer-events: none; }
.app { position: absolute; inset: 0; }

/* panneau latéral */
.panel { width: 360px; max-height: 844px; overflow: auto; display: grid; gap: 22px; align-content: start; padding-right: 4px; }
.panel-h { display: grid; gap: 6px; }
.panel-h .k { font: 800 11px/14px var(--font-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--graphite-doux); }
.panel-h h1 { margin: 0; font: 400 30px/34px var(--font-display); }
.panel-h p { margin: 0; font-size: 14.5px; line-height: 21px; color: var(--graphite-doux); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--craie); border-radius: 999px; padding: 4px; box-shadow: var(--ombre-billet); }
.tabs button { border: 0; background: transparent; border-radius: 999px; padding: 9px 8px; font-weight: 700; font-size: 13.5px; cursor: pointer; color: var(--graphite-doux); }
.tabs button[aria-pressed="true"] { background: var(--graphite); color: var(--papier); }
.why { background: var(--craie); border-radius: 18px; padding: 16px 18px; box-shadow: var(--ombre-billet); display: grid; gap: 6px; }
.why b { font: 800 11px/14px var(--font-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--rouge-texte); }
.why p { margin: 0; font-size: 14.5px; line-height: 21px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: s; }
.steps .ph { font: 800 11px/14px var(--font-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--graphite-doux); margin: 12px 0 4px; }
.steps .ph:first-child { margin-top: 0; }
.steps button { width: 100%; text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 7px 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; color: var(--graphite); }
.steps button:hover { background: var(--craie); }
.steps button i { width: 8px; height: 8px; border-radius: 50%; background: var(--filet); flex: none; }
.steps button.vu i { background: var(--graphite-doux); }
.steps button[aria-current="step"] { background: var(--craie); font-weight: 700; box-shadow: var(--ombre-billet); }
.steps button[aria-current="step"] i { background: var(--rouge); }
.panel-f { display: flex; gap: 8px; flex-wrap: wrap; }
.pbtn { border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 700; font-size: 13.5px; cursor: pointer; background: var(--craie); color: var(--graphite); box-shadow: var(--ombre-billet); }
@media (max-width: 1000px) { .panel { display: none; } }

/* plein écran sur téléphone */
@media (max-width: 520px) {
  .stage { padding: 0; display: block; height: 100%; }
  .device { width: 100%; height: 100%; border-radius: 0; padding: 0; box-shadow: none; background: var(--papier); transform: none !important; }
  .device::before, .sbar, .homebar { display: none; }
  .phone { border-radius: 0; }
}

/* ---------- écrans ---------- */
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--papier); padding-top: 50px; will-change: transform; }
@media (max-width: 520px) { .scr { padding-top: env(safe-area-inset-top, 0px); } }
.scr.in-r { animation: inR .34s var(--ease) both; }
.scr.in-l { animation: inL .34s var(--ease) both; }
.scr.out-l { animation: outL .34s var(--ease) both; }
.scr.out-r { animation: outR .34s var(--ease) both; }
.scr.in-f { animation: inF .4s ease both; }
@keyframes inR { from { transform: translateX(100%); } to { transform: none; } }
@keyframes inL { from { transform: translateX(-30%); opacity: .6; } to { transform: none; opacity: 1; } }
@keyframes outL { to { transform: translateX(-30%); opacity: .6; } }
@keyframes outR { to { transform: translateX(100%); } }
.scr.out-f { animation: outF .25s ease both; }
@keyframes outF { to { opacity: 0; } }
@keyframes inF { from { opacity: 0; } to { opacity: 1; } }

.tb { height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; }
.back { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--graphite); flex: none; }
.back:hover { background: var(--craie); }
.back[hidden] + .prog { margin-left: 52px; }
.prog { flex: 1; height: 6px; border-radius: 3px; background: var(--filet); overflow: hidden; }
.prog i { display: block; height: 100%; border-radius: 3px; background: var(--rouge); transition: width .5s var(--ease); }
.skip { border: 0; background: transparent; font-weight: 700; font-size: 15px; color: var(--graphite-doux); cursor: pointer; padding: 8px 4px; min-width: 40px; }
.tb-vide { width: 40px; flex: none; }

.sc { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 24px 16px; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
.sc.centre { justify-content: flex-start; text-align: center; align-items: center; }
.sc.centre > :first-child { margin-top: auto; }
.sc.centre > :last-child { margin-bottom: auto; }
.t { margin: 0; font: 400 30px/35px var(--font-display); text-wrap: balance; outline: none; }
.t.xl { font-size: 34px; line-height: 38px; }
.s { margin: 0; font-size: 16.5px; line-height: 24px; color: var(--graphite-doux); text-wrap: pretty; }
.s b { color: var(--graphite); font-weight: 700; }
.ft { flex: none; padding: 12px 24px 34px; display: grid; gap: 10px; }
@media (max-width: 520px) { .ft { padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); } }
.legal { margin: 2px 0 0; text-align: center; font-size: 12px; line-height: 17px; color: var(--graphite-doux); }
.legal u { text-underline-offset: 2px; }

/* boutons */
.btn { width: 100%; min-height: 56px; border: 0; border-radius: 999px; font: 700 17px/22px var(--font-sans); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 0 22px; transition: transform .15s ease, opacity .2s ease; }
.btn:active { transform: scale(.98); }
.btn-p { background: var(--rouge); color: var(--on-rouge); }
.btn-b { background: var(--bleu); color: var(--on-bleu); }
.btn-noir { background: var(--graphite); color: var(--papier); }
.btn-clair { background: var(--craie); color: var(--graphite); box-shadow: inset 0 0 0 1.5px var(--graphite-doux); }
.btn[disabled] { opacity: .38; cursor: not-allowed; transform: none; }
.lnk { border: 0; background: transparent; font: 700 15px/20px var(--font-sans); color: var(--graphite); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; cursor: pointer; padding: 8px; justify-self: center; }
.lnk.doux { color: var(--graphite-doux); }

/* champs */
.champ { display: grid; gap: 8px; }
.champ label, .lab { font: 700 14px/18px var(--font-sans); color: var(--graphite); }
.champ small { font-size: 13px; color: var(--graphite-doux); }
.in { width: 100%; height: 58px; border-radius: 16px; border: 1.5px solid var(--graphite-doux); background: var(--craie); color: var(--graphite); font: 500 18px/22px var(--font-sans); padding: 0 18px; outline: none; transition: border-color .15s, box-shadow .15s; }
.in::placeholder { color: var(--graphite-doux); opacity: .8; }
.in:focus { border-color: var(--bleu); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bleu) 22%, transparent); }
select.in { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--graphite) 50%), linear-gradient(135deg, var(--graphite) 50%, transparent 50%); background-position: calc(100% - 22px) 50%, calc(100% - 16px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
.duo { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; }
.code { text-align: center; letter-spacing: .5em; text-transform: uppercase; font: 800 26px/1 var(--font-sans); padding-left: calc(18px + .5em); height: 68px; }
.hint { font-size: 13px; color: var(--graphite-doux); text-align: center; margin: 0; }
.err { font-size: 14px; color: var(--rouge-texte); font-weight: 600; margin: 0; }

/* options */
.opts { display: grid; gap: 10px; }
.opt { width: 100%; min-height: 62px; border-radius: 18px; border: 1.5px solid var(--filet); background: var(--craie); padding: 14px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; text-align: left; transition: border-color .15s, background-color .15s, transform .15s; }
.opt:active { transform: scale(.985); }
.opt .ol { flex: 1; display: grid; gap: 2px; min-width: 0; }
.opt .ol b { font: 700 17px/22px var(--font-sans); }
.opt .ol span { font-size: 14px; line-height: 19px; color: var(--graphite-doux); }
.opt .rd { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--graphite-doux); flex: none; display: grid; place-items: center; transition: all .15s; }
.opt.multi .rd { border-radius: 7px; }
.opt[aria-checked="true"] { border-color: var(--rouge); border-width: 2px; padding: 13.5px 17.5px; background: var(--buvard); }
.opt[aria-checked="true"] .rd { border-color: var(--rouge); background: var(--rouge); }
.opt .rd svg { opacity: 0; color: var(--on-rouge); }
.opt[aria-checked="true"] .rd svg { opacity: 1; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.seg button { height: 50px; border-radius: 14px; border: 1.5px solid var(--filet); background: var(--craie); font-weight: 700; font-size: 16px; cursor: pointer; }
.seg button[aria-checked="true"] { border: 2px solid var(--rouge); background: var(--buvard); }

/* illustrations */
.ill { display: grid; place-items: center; }
.ill svg { display: block; overflow: visible; }
.hero-ill { flex: 1; display: grid; place-items: center; min-height: 0; position: relative; }
.motif { position: absolute; inset: 0; opacity: .55; }

/* liste rassurante */
.ras { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.ras li { display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: center; font-size: 15.5px; line-height: 22px; }
.ras .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--craie); box-shadow: var(--ombre-billet); color: var(--bleu); }
.check { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; cursor: pointer; font-size: 14.5px; line-height: 21px; text-align: left; border: 0; background: transparent; padding: 0; }
.check .bx { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--graphite-doux); display: grid; place-items: center; transition: all .15s; margin-top: -1px; }
.check .bx svg { opacity: 0; color: var(--on-rouge); }
.check[aria-checked="true"] .bx { background: var(--rouge); border-color: var(--rouge); }
.check[aria-checked="true"] .bx svg { opacity: 1; }

/* billets */
.billet { background: var(--craie); border-radius: 4px; box-shadow: var(--ombre-billet); padding: 16px 16px 12px; position: relative; }
.billet.toi { transform: rotate(-1.4deg); margin-right: 18px; }
.billet.autre { transform: rotate(1.2deg); margin-left: 18px; }
.billet p { margin: 0; font: 500 16.5px/23px var(--font-sans); overflow-wrap: anywhere; }
.billet .sig { display: block; text-align: right; margin-top: 6px; font: italic 600 14px/18px var(--font-sans); color: var(--rouge-texte); }
.billet.autre .sig { color: var(--bleu); }
.billet .mic { font: 800 10.5px/14px var(--font-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--graphite-doux); display: block; margin-bottom: 6px; }
.billet textarea { width: 100%; min-height: 96px; border: 0; resize: none; background: transparent; color: var(--graphite); font: 500 16.5px/23px var(--font-sans); outline: none; padding: 0; }
.billet textarea::placeholder { color: var(--graphite-doux); font-style: italic; font-weight: 400; }
.billet .cpt { display: block; text-align: right; font-size: 12px; color: var(--graphite-doux); }
.billet.scelle::after { content: ""; position: absolute; top: 0; right: 0; width: 22px; height: 22px; background: linear-gradient(225deg, var(--papier) 50%, var(--filet) 50%); border-bottom-left-radius: 3px; }
.scel { display: flex; align-items: center; gap: 12px; font: 600 14px/19px var(--font-sans); color: var(--graphite-doux); padding-right: 16px; }
.attente { border: 2px dashed var(--filet); border-radius: 6px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; margin-left: 18px; font: 600 14px/19px var(--font-sans); color: var(--graphite-doux); }
.mini-q { display: grid; gap: 14px; }

/* carte question */
.qhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.serie { display: inline-flex; align-items: center; gap: 6px; background: var(--beurre); color: var(--on-beurre); border-radius: 999px; padding: 4px 12px 4px 10px; font: 800 13px/18px var(--font-sans); transition: transform .3s var(--ressort); }
.serie.pop { transform: scale(1.18); }
.micro { font: 800 11px/14px var(--font-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--graphite-doux); }
.q { margin: 0; font: 400 27px/33px var(--font-display); text-wrap: balance; }
.qm { color: var(--rouge); font-size: 1.25em; line-height: 0; }
.pied { display: flex; align-items: center; gap: 12px; font: 500 14px/20px var(--font-sans); color: var(--graphite-doux); }
.proto { display: inline-flex; align-items: center; gap: 8px; border: 1.5px dashed var(--graphite-doux); background: transparent; border-radius: 999px; padding: 9px 14px; font: 700 13px/1 var(--font-sans); color: var(--graphite-doux); cursor: pointer; justify-self: center; }
.proto em { font-style: normal; background: var(--graphite-doux); color: var(--papier); border-radius: 4px; padding: 2px 5px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }

/* révélation */
.cachet-anim { transition: transform .5s var(--ressort), opacity .45s ease; }
.ouvre .cachet-anim { transform: scale(1.35) rotate(-18deg); opacity: 0; }
.rev-txt { animation: revTxt .6s .25s var(--ease) both; }
@keyframes revTxt { from { filter: blur(8px); opacity: 0; transform: translateY(6px); } to { filter: none; opacity: 1; transform: none; } }

/* paywall */
.pw-top { position: absolute; top: 58px; left: 16px; z-index: 3; }
.fermer { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--craie); box-shadow: var(--ombre-billet); display: grid; place-items: center; cursor: pointer; color: var(--graphite-doux); opacity: 0; animation: inF .3s 1.4s ease forwards; }
.essai { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--craie); border-radius: 16px; padding: 12px 16px; box-shadow: var(--ombre-billet); }
.essai b { font-size: 15.5px; }
.essai small { display: block; font-size: 13px; color: var(--graphite-doux); }
.sw { width: 52px; height: 32px; border-radius: 999px; background: var(--filet); border: 0; position: relative; cursor: pointer; flex: none; transition: background-color .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); transition: transform .2s var(--ease); }
.sw[aria-checked="true"] { background: var(--rouge); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
.sw[disabled] { opacity: .4; cursor: not-allowed; }
.offre { width: 100%; text-align: left; border-radius: 18px; border: 2px solid var(--filet); background: var(--craie); padding: 14px 18px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; cursor: pointer; position: relative; color: var(--graphite); }
.offre[aria-checked="true"] { border-color: var(--graphite); background: var(--beurre-pale); box-shadow: var(--ombre-billet); }
.offre .ti { font: 400 21px/26px var(--font-display); }
.offre .de { grid-column: 1; font-size: 13.5px; line-height: 19px; color: var(--graphite-doux); }
.offre .pr { grid-column: 2; grid-row: 1 / span 2; text-align: right; align-self: center; }
.offre .pr b { display: block; font: 800 22px/26px var(--font-sans); letter-spacing: -.02em; }
.offre .pr span { font-size: 12px; color: var(--graphite-doux); }
.etq { position: absolute; top: -11px; left: 16px; background: var(--beurre); color: var(--on-beurre); border-radius: 999px; padding: 2px 10px; font: 800 10.5px/16px var(--font-sans); letter-spacing: .1em; text-transform: uppercase; }
.frise { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.frise li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; position: relative; padding-bottom: 14px; }
.frise li:last-child { padding-bottom: 0; }
.frise li::before { content: ""; position: absolute; left: 13px; top: 24px; bottom: 0; width: 2px; background: var(--filet); }
.frise li:last-child::before { display: none; }
.frise .pt { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--craie); box-shadow: var(--ombre-billet); color: var(--graphite); }
.frise .pt.on { background: var(--rouge); color: var(--on-rouge); }
.frise b { display: block; font-size: 15px; line-height: 20px; }
.frise span { font-size: 13.5px; line-height: 19px; color: var(--graphite-doux); }
.inclus { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.inclus li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 21px; }
.inclus svg { flex: none; color: var(--bleu); margin-top: 2px; }
.prix-barre { display: flex; align-items: baseline; justify-content: center; gap: 12px; }
.prix-barre b { font: 800 44px/1 var(--font-sans); letter-spacing: -.03em; }
.prix-barre s { font-size: 20px; color: var(--graphite-doux); }
.limite { display: inline-flex; align-items: center; gap: 8px; background: var(--beurre-pale); border-radius: 999px; padding: 7px 14px; font: 700 13.5px/1 var(--font-sans); }

/* avant / après */
.cmp { display: grid; gap: 12px; }
.cmp > div { border-radius: 18px; padding: 16px 18px; display: grid; gap: 10px; }
.cmp .sans { background: transparent; border: 1.5px dashed var(--filet); }
.cmp .avec { background: var(--craie); box-shadow: var(--ombre-billet); }
.cmp h3 { margin: 0; font: 800 11px/14px var(--font-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--graphite-doux); }
.cmp .avec h3 { color: var(--bleu); }
.cmp ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cmp li { display: flex; gap: 10px; font-size: 15px; line-height: 21px; }
.cmp .sans li { color: var(--graphite-doux); }
.cmp li svg { flex: none; margin-top: 2px; }

/* invitation */
.msg { background: var(--craie); border-radius: 20px 20px 20px 6px; box-shadow: var(--ombre-billet); padding: 14px 16px; font-size: 15px; line-height: 21px; }
.msg .mic { font: 800 10.5px/14px var(--font-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--graphite-doux); display: block; margin-bottom: 6px; }
.codebox { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--beurre-pale); border-radius: 16px; padding: 12px 12px 12px 18px; }
.codebox .lab { font-size: 12px; color: var(--graphite-doux); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.codebox b { display: block; font: 800 24px/1.1 var(--font-sans); letter-spacing: .14em; }
.copier { border: 0; background: var(--craie); border-radius: 12px; padding: 10px 14px; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; box-shadow: var(--ombre-billet); }

/* notifications (maquette écran verrouillé) */
.verr { border-radius: 26px; padding: 22px 14px 16px; display: grid; gap: 8px; position: relative; overflow: hidden; background: var(--bleu-pale); }
.verr .h { text-align: center; font: 700 44px/1 var(--font-sans); color: var(--graphite); letter-spacing: -.02em; position: relative; }
.verr .d { text-align: center; font-size: 13px; font-weight: 600; color: var(--graphite-doux); margin-bottom: 6px; position: relative; }
.nt { display: grid; grid-template-columns: 36px 1fr; gap: 10px; background: var(--craie); border-radius: 18px; padding: 10px 12px; box-shadow: var(--ombre-billet); position: relative; text-align: left; }
.nt .ic { width: 36px; height: 36px; border-radius: 9px; background: #F5F2EC; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(38, 37, 46, .08); }
.nt b { display: flex; justify-content: space-between; font-size: 13.5px; line-height: 18px; }
.nt b em { font-style: normal; font-weight: 500; color: var(--graphite-doux); font-size: 12px; }
.nt p { margin: 1px 0 0; font-size: 13.5px; line-height: 18px; }

/* analyse */
.etapes { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; width: 100%; text-align: left; }
.etapes li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; font-size: 16px; line-height: 22px; opacity: .35; transition: opacity .3s; }
.etapes li.on { opacity: 1; }
.etapes .pt { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--filet); display: grid; place-items: center; transition: all .3s; }
.etapes li.ok .pt { background: var(--bleu); border-color: var(--bleu); color: var(--on-bleu); }
.etapes li.on:not(.ok) .pt { border-color: var(--bleu); border-top-color: transparent; animation: tourne .8s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }

/* overlays système (iOS) */
.voile { position: absolute; inset: 0; background: var(--voile); z-index: 40; animation: inF .2s ease both; }
.sheet { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 41; background: var(--sys-feuille); color: var(--sys-texte); border-radius: 34px; padding: 22px 20px 26px; display: grid; gap: 14px; animation: monte .35s var(--ease) both; font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; }
@keyframes monte { from { transform: translateY(105%); } to { transform: none; } }
.sheet .sh-h { display: flex; align-items: center; justify-content: space-between; }
.sheet .sh-h b { font-size: 17px; }
.sheet .x { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--sys-ligne); color: var(--sys-gris); cursor: pointer; display: grid; place-items: center; }
.sheet .row { background: var(--craie); border-radius: 12px; padding: 12px 14px; font-size: 15px; display: grid; gap: 2px; }
.sheet .row small { color: var(--sys-gris); font-size: 13px; }
.sheet .sys-btn { height: 52px; border: 0; border-radius: 14px; background: var(--sys-bleu); color: #FFFFFF; font: 600 17px/1 -apple-system, system-ui, sans-serif; cursor: pointer; }
.sheet .sys-btn.noir { background: var(--sys-texte); color: var(--sys-feuille); }
.sheet .appl { display: flex; gap: 12px; align-items: center; }
.sheet .appl .ic { width: 54px; height: 54px; border-radius: 13px; background: #F5F2EC; display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); flex: none; }
.sheet .appl b { font-size: 16px; display: block; }
.sheet .appl small { font-size: 13px; color: var(--sys-gris); }
.sheet .fid { display: grid; place-items: center; gap: 10px; padding: 8px 0; font-size: 15px; }
.sheet .fid .ring { width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--sys-bleu); border-top-color: transparent; animation: tourne .9s linear infinite; }
.sheet .fid .ok { width: 64px; height: 64px; border-radius: 50%; background: var(--sys-bleu); color: #FFFFFF; display: grid; place-items: center; animation: inF .2s ease both; }
.alerte { position: absolute; left: 50%; top: 50%; width: 270px; margin-left: -135px; transform: translateY(-50%); z-index: 41; background: var(--sys-feuille); color: var(--sys-texte); border-radius: 16px; text-align: center; overflow: hidden; font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; animation: inF .2s ease both; }
.alerte div:first-child { padding: 18px 16px 16px; display: grid; gap: 4px; }
.alerte b { font-size: 16px; line-height: 21px; }
.alerte p { margin: 0; font-size: 13px; line-height: 17px; }
.alerte .acts { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--sys-ligne); }
.alerte .acts button { border: 0; background: transparent; padding: 12px; color: var(--sys-bleu); font-size: 16px; cursor: pointer; }
.alerte .acts button + button { border-left: 1px solid var(--sys-ligne); font-weight: 600; }

/* bannière de notification dans l'app + toast */
.banniere { position: absolute; top: 54px; left: 10px; right: 10px; z-index: 35; animation: descend .45s var(--ease) both; }
.banniere.part { animation: remonte .35s ease both; }
@keyframes descend { from { transform: translateY(-140%); } to { transform: none; } }
@keyframes remonte { to { transform: translateY(-140%); opacity: 0; } }
.toast { position: absolute; left: 20px; right: 20px; bottom: 112px; z-index: 36; background: var(--graphite); color: var(--papier); border-radius: 14px; padding: 12px 16px; font-size: 14.5px; line-height: 20px; font-weight: 600; text-align: center; animation: inF .2s ease both; box-shadow: var(--ombre-flottante); }

/* ================= mascottes vivantes ================= */
.pv-wrap { display: inline-block; line-height: 0; }
.pv-wrap.flotte { animation: flotte 4.2s ease-in-out infinite; }
@keyframes flotte { 50% { transform: translateY(-7px); } }
.pv .pv-corps { transform-box: fill-box; transform-origin: 50% 100%; animation: respire 3.2s ease-in-out infinite; }
.pv .pv-corps-v { transform-box: fill-box; transform-origin: 50% 30%; animation: balance 3.8s ease-in-out infinite; }
.pv .pv-yeux { transform-box: fill-box; transform-origin: 50% 50%; animation: cligne 4.6s infinite; }
.pv .pv-ev .pv-yeux { animation-delay: 1.4s; }
.pv .pv-pup { animation: regard 8s ease-in-out infinite; }
.pv .pv-ev .pv-pup { animation-delay: .9s; }
.pv .pv-etoile { transform-box: fill-box; transform-origin: center; animation: brille 1.9s ease-in-out infinite; animation-delay: var(--d, 0s); }
.pv .pv-coeur { transform-box: fill-box; transform-origin: center; animation: monteCoeur 2.8s ease-in-out infinite; animation-delay: var(--d, 0s); }
.pv .pv-z { transform-box: fill-box; transform-origin: center; animation: zz 2.6s ease-in infinite; animation-delay: var(--d, 0s); }
.pv .pv-conf { transform-box: fill-box; transform-origin: center; animation: virevolte 2.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
.pv .pv-pt { transform-box: fill-box; transform-origin: center; animation: pointille 1.3s ease-in-out infinite; animation-delay: calc(var(--i, 0) * .18s); }
.pv .pv-q { transform-box: fill-box; transform-origin: 50% 100%; animation: qbond 1.8s cubic-bezier(.34, 1.4, .64, 1) infinite; }

.pose-fete .pv-corps, .pose-fete .pv-corps-v { transform-origin: 50% 100%; animation: sauter .9s cubic-bezier(.3, .7, .4, 1) infinite; }
.pose-fete .pv-corps-v { animation-delay: .45s; }
.pose-revelation .pv-corps, .pose-revelation .pv-corps-v { transform-origin: 50% 100%; animation: surprise 2.2s ease-in-out infinite; }
.pose-revelation .pv-corps-v { animation-delay: .25s; }
.pose-calin .pv-corps, .pose-calin .pv-corps-v { transform-origin: 50% 100%; animation: berce 3.4s ease-in-out infinite; }
.pose-endormi .pv-corps, .pose-endormi .pv-corps-v { animation: dodo 3.6s ease-in-out infinite; }
.pose-attente .pv-corps { animation: impatient 2.6s ease-in-out infinite; }
.salut .pv-corps-v { animation: salut 1.1s ease-in-out 2, balance 3.8s 2.2s ease-in-out infinite; }

@keyframes respire { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.035, .965); } }
@keyframes balance { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
@keyframes cligne { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes regard { 0%, 38%, 100% { transform: translate(0, 0); } 44%, 58% { transform: translate(2.2px, -1px); } 64%, 80% { transform: translate(-2.2px, .5px); } }
@keyframes brille { 0%, 100% { transform: scale(.65) rotate(0); opacity: .55; } 50% { transform: scale(1.15) rotate(25deg); opacity: 1; } }
@keyframes monteCoeur { 0% { transform: translateY(8px) scale(.7); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(-22px) scale(1.05); opacity: 0; } }
@keyframes zz { 0% { transform: translate(-4px, 8px) scale(.5); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(8px, -16px) scale(1.1); opacity: 0; } }
@keyframes virevolte { 0%, 100% { transform: translateY(-5px) rotate(0); } 50% { transform: translateY(6px) rotate(180deg); } }
@keyframes pointille { 0%, 100% { transform: translateY(0); opacity: .25; } 35% { transform: translateY(-7px); opacity: .95; } }
@keyframes qbond { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-10px) rotate(-10deg); } 55% { transform: translateY(0) rotate(5deg); } 75% { transform: translateY(-3px) rotate(0); } }
@keyframes sauter { 0%, 100% { transform: translateY(0) scale(1.06, .94); } 15% { transform: translateY(0) scale(.94, 1.06); } 45% { transform: translateY(-16px) scale(1, 1); } 75% { transform: translateY(0) scale(1.04, .96); } }
@keyframes surprise { 0%, 60%, 100% { transform: translateY(0) scale(1); } 70% { transform: translateY(-10px) scale(1.04); } 82% { transform: translateY(0) scale(1.02, .98); } }
@keyframes berce { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
@keyframes dodo { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.05, .95); } }
@keyframes impatient { 0%, 100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-2px) rotate(-4deg); } 40% { transform: translateX(2px) rotate(4deg); } 60% { transform: translateX(0) rotate(0); } }
@keyframes salut { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }

/* entrées des mascottes */
.entree .pv-ep, .entree .pv-ev { transform-box: fill-box; animation: chute .85s cubic-bezier(.34, 1.5, .64, 1) both; }
.entree .pv-ev { animation-delay: .2s; }
@keyframes chute { from { transform: translateY(-160px) scale(.8); opacity: 0; } 55% { opacity: 1; } to { transform: none; opacity: 1; } }
.pop { animation: pop .6s cubic-bezier(.34, 1.5, .64, 1) both; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.pv.hop { animation: hop .55s cubic-bezier(.34, 1.5, .64, 1); }
@keyframes hop { 0% { transform: none; } 30% { transform: translateY(-14px) scale(.95, 1.06); } 60% { transform: translateY(0) scale(1.06, .94); } 100% { transform: none; } }
.pv.hoche { animation: hoche .4s ease-in-out; }
@keyframes hoche { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-6deg); } 70% { transform: rotate(5deg); } }

/* ================= écrans pleine couleur ================= */
.scr.fond-bleu { background: var(--bleu); color: var(--on-bleu); }
.scr.fond-beurre { background: var(--beurre); color: var(--on-beurre); }
.fond-bleu .s, .fond-bleu .s b, .fond-bleu .legal, .fond-bleu .lnk, .fond-bleu .back, .fond-bleu .skip { color: var(--on-bleu); }
.fond-bleu .s, .fond-bleu .legal { opacity: .9; }
.fond-bleu .btn-p, .fond-bleu .btn-noir { background: var(--on-bleu); color: var(--bleu); }
.fond-bleu .btn-clair { background: transparent; color: var(--on-bleu); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--on-bleu) 60%, transparent); }
.fond-bleu .back:hover { background: color-mix(in srgb, var(--on-bleu) 14%, transparent); }
.fond-bleu .prog { background: color-mix(in srgb, var(--on-bleu) 24%, transparent); }
.fond-bleu .prog i { background: var(--beurre); }
.fond-bleu .prog i::after { background: var(--beurre); box-shadow: 0 0 0 3px var(--bleu); }
.fond-beurre .s, .fond-beurre .s b, .fond-beurre .lnk { color: var(--on-beurre); }
.fond-beurre .s { opacity: .85; }
.fond-beurre .btn-p { background: var(--on-beurre); color: var(--beurre); }
.billet, .nt, .msg { color: var(--graphite); }
.phone[data-haut="bleu"] .sbar { color: var(--on-bleu); }
.phone[data-haut="rouge"] .sbar { color: var(--on-rouge); }
.phone[data-haut="beurre"] .sbar { color: var(--on-beurre); }
.phone[data-bas="bleu"] .homebar { background: var(--on-bleu); }
.phone[data-bas="beurre"] .homebar { background: var(--on-beurre); }

/* ponctuation qui dérive en fond */
.ambiance { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.ambiance span { position: absolute; font-family: var(--font-display); line-height: 1; color: currentColor; opacity: .13; animation: derive var(--dur, 9s) ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes derive { 0%, 100% { transform: translate(0, 0) rotate(var(--r, 0deg)); } 50% { transform: translate(var(--x, 10px), var(--y, -18px)) rotate(calc(var(--r, 0deg) + 14deg)); } }
.scr > .tb, .scr > .sc, .scr > .ft, .scr > .hero-ill { position: relative; z-index: 1; }

/* compagnon qui veille sur les questions */
.compagnon { position: absolute; right: 16px; top: 98px; z-index: 2; pointer-events: none; }
.avec-comp .sc > h1.t { padding-right: 78px; }

/* progression avec Point au bout */
.prog { overflow: visible; position: relative; }
.prog i { position: relative; transition: width .6s cubic-bezier(.34, 1.3, .64, 1); }
.prog i::after { content: ""; position: absolute; right: -6px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: var(--bleu); box-shadow: 0 0 0 3px var(--papier); }
.prog.bond i::after { animation: bond .5s cubic-bezier(.34, 1.6, .64, 1); }
@keyframes bond { 40% { transform: scale(1.5); } }

/* entrée en cascade du contenu */
.cascade .sc > *:not(.opts):not(.mini-q):not(.cmp), .cascade .opts > *, .cascade .cmp > *, .cascade .ft > * { animation: monte .55s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 55ms + 140ms); }
@keyframes monte { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.opt[aria-checked="true"] .rd { animation: coche .35s cubic-bezier(.34, 1.6, .64, 1); }
@keyframes coche { from { transform: scale(.5); } to { transform: scale(1); } }
.seg button[aria-checked="true"] { animation: coche .3s cubic-bezier(.34, 1.6, .64, 1); }

/* billets */
.billet { transform: rotate(var(--rot, 0deg)); }
.billet.toi { --rot: -1.4deg; }
.billet.autre { --rot: 1.2deg; }
.billet.donne { animation: donne .7s cubic-bezier(.34, 1.3, .64, 1) both; animation-delay: var(--d, 0s); }
@keyframes donne { from { transform: translateY(60px) rotate(-10deg) scale(.9); opacity: 0; } to { transform: rotate(var(--rot)); opacity: 1; } }
.billet.arrive { animation: arrive .7s cubic-bezier(.34, 1.4, .64, 1) both; }
@keyframes arrive { from { transform: translate(40px, -50px) rotate(14deg); opacity: 0; } to { transform: rotate(var(--rot)); opacity: 1; } }
.billet.glisse { animation: glisse .6s cubic-bezier(.34, 1.3, .64, 1) both; }
@keyframes glisse { 0% { transform: rotate(0) scale(1.02); } 100% { transform: rotate(var(--rot)); } }
.billet.deplie { animation: deplie .85s cubic-bezier(.34, 1.3, .64, 1) both; transform-origin: 50% 0; }
@keyframes deplie { from { transform: rotate(var(--rot)) perspective(700px) rotateX(-88deg); opacity: 0; } to { transform: rotate(var(--rot)); opacity: 1; } }
.cachet-anim.casse { animation: casse .75s ease-in both; }
@keyframes casse { 0% { transform: none; } 14% { transform: rotate(-12deg) scale(1.05); } 28% { transform: rotate(10deg); } 42% { transform: rotate(-8deg) scale(1.1); } 58% { transform: rotate(0) scale(1.2); opacity: 1; } 100% { transform: scale(2) rotate(30deg); opacity: 0; } }
.serie.pop { animation: seriePop .6s cubic-bezier(.34, 1.8, .64, 1); }
@keyframes seriePop { 40% { transform: scale(1.35); box-shadow: 0 0 0 8px color-mix(in srgb, var(--beurre) 40%, transparent); } }

/* notifications qui tombent */
.fond-bleu .verr { background: color-mix(in srgb, var(--on-bleu) 12%, transparent); }
.fond-bleu .verr .h, .fond-bleu .verr .d { color: var(--on-bleu); }
.verr .nt { animation: tombeNt .7s cubic-bezier(.34, 1.4, .64, 1) both; animation-delay: .7s; }
.verr .nt + .nt { animation-delay: 1.5s; }
@keyframes tombeNt { from { transform: translateY(-36px) scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }

/* analyse sur fond bleu */
.fond-bleu .etapes li .pt { border-color: color-mix(in srgb, var(--on-bleu) 35%, transparent); }
.fond-bleu .etapes li.on:not(.ok) .pt { border-color: var(--beurre); border-top-color: transparent; }
.fond-bleu .etapes li.ok .pt { background: var(--beurre); border-color: var(--beurre); color: var(--on-beurre); }

/* bandeau coloré du paywall et de l'offre (à la Paired) */
.band { margin: -58px -24px 0; padding: 64px 24px 26px; border-radius: 0 0 34px 34px; display: grid; justify-items: center; text-align: center; gap: 6px; position: relative; overflow: hidden; }
.band.b-bleu { background: var(--bleu); color: var(--on-bleu); }
.band.b-rouge { background: var(--rouge); color: var(--on-rouge); }
.band > *:not(.ambiance) { position: relative; z-index: 1; }
.band .t { color: inherit; }
.band .s { color: inherit; opacity: .9; }
.remise { font: 400 64px/1 var(--font-display); letter-spacing: -.02em; }
.btn-p.brille-cta { position: relative; overflow: hidden; }
.btn-p.brille-cta::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, color-mix(in srgb, #FFFFFF 45%, transparent), transparent); animation: reflet 3.2s 1.2s ease-in-out infinite; }
@keyframes reflet { 0% { left: -60%; } 45%, 100% { left: 130%; } }
.etq { animation: etq 2.8s 1s ease-in-out infinite; transform-origin: left center; }
@keyframes etq { 0%, 86%, 100% { transform: rotate(0); } 90% { transform: rotate(-4deg); } 95% { transform: rotate(3deg); } }

/* confettis */
.confetti { position: absolute; z-index: 45; pointer-events: none; top: 0; left: 0; border-radius: 2px; }
.fond-bleu .qm { color: var(--beurre); }
.sc > * { flex-shrink: 0; }

/* ================= avant / après interactif ================= */
.bascule { display: grid; grid-template-columns: 1fr 1fr; position: relative; background: var(--craie); border-radius: 999px; padding: 4px; box-shadow: var(--ombre-billet); }
.bascule::before { content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px; background: var(--graphite); transition: transform .45s cubic-bezier(.34, 1.3, .64, 1), background-color .45s; }
.bascule.avec::before { transform: translateX(100%); background: var(--bleu); }
.bascule button { position: relative; z-index: 1; border: 0; background: transparent; border-radius: 999px; padding: 11px 6px; font: 700 14.5px/18px var(--font-sans); color: var(--graphite-doux); cursor: pointer; transition: color .3s; }
.bascule button[aria-pressed="true"] { color: var(--papier); }
.bascule.avec button[aria-pressed="true"] { color: var(--on-bleu); }
.scene { position: relative; border-radius: 28px; overflow: hidden; min-height: 382px; box-shadow: var(--ombre-billet); }
.sc-sans, .sc-avec { position: absolute; inset: 0; padding: 22px 22px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; transition: opacity .6s ease, transform .6s cubic-bezier(.2, .8, .2, 1); }
.sc-sans { background: var(--filet); color: var(--graphite-doux); }
.sc-sans .sc-ill { filter: grayscale(1); opacity: .7; }
.sc-avec { background: var(--bleu); color: var(--on-bleu); opacity: 0; transform: scale(.94); }
.scene.avec .sc-avec { opacity: 1; transform: none; }
.scene.avec .sc-sans { opacity: 0; transform: scale(1.05); }
.sc-sans ul, .sc-avec ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; width: 100%; position: relative; z-index: 1; }
.sc-sans li, .sc-avec li { display: flex; gap: 10px; align-items: flex-start; font: 600 15.5px/21px var(--font-sans); }
.sc-sans li svg { flex: none; margin-top: 2px; }
.sc-avec li .ok { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--beurre); color: var(--on-beurre); display: grid; place-items: center; margin-top: -1px; }
.sc-avec .sc-ill { position: relative; z-index: 1; }
.scene.avec .sc-avec li { animation: monte .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 140ms + 280ms); }
.scene:not(.avec) .sc-sans li { animation: monte .5s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 110ms + 200ms); }
.scene.avec .sc-avec .pv-wrap { animation: pop .6s cubic-bezier(.34, 1.5, .64, 1) both, flotte 4.2s .6s ease-in-out infinite; }

/* ================= variantes thématiques de Point et Virgule ================= */
/* souvenirs : la photo se balance sur sa pince */
.pv .pv-photo { transform-box: fill-box; transform-origin: 50% 0; animation: photo 3.4s ease-in-out infinite; }
@keyframes photo { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(6deg); } }
/* avenir : l'avion en papier file, sa traînée défile */
.pv .pv-trace { animation: trace 1.1s linear infinite; }
@keyframes trace { to { stroke-dashoffset: -24; } }
.pv .pv-avion { transform-box: fill-box; transform-origin: center; animation: avion 3s ease-in-out infinite; }
@keyframes avion { 0%, 100% { transform: translate(0, 0) rotate(0); } 30% { transform: translate(8px, -11px) rotate(-9deg); } 65% { transform: translate(-6px, 5px) rotate(6deg); } }
/* argent : la pièce est lancée en l'air et tourne */
.pv .pv-piece { animation: piece 1.9s infinite; }
@keyframes piece { 0%, 100% { transform: translateY(0); animation-timing-function: cubic-bezier(.2, .7, .4, 1); } 42% { transform: translateY(-34px); animation-timing-function: cubic-bezier(.6, 0, .8, .4); } 84% { transform: translateY(0); } 90% { transform: translateY(-3px); } }
.pv .pv-piece-f { transform-box: fill-box; transform-origin: center; animation: flip .42s linear infinite; }
@keyframes flip { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(-1); } }
.pv .pv-pile { transform-box: fill-box; animation: pile 1.9s ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes pile { 0%, 80%, 100% { transform: none; } 88% { transform: translateY(-4px); } }
.pose-argent .pv-ep .pv-corps { animation: lance 1.9s infinite; }
@keyframes lance { 0%, 100% { transform: scale(1.06, .94); } 8% { transform: translateY(-6px) scale(.96, 1.05); } 18%, 78% { transform: none; } 86% { transform: scale(1.06, .94); } }
/* disputes : nuage d'orage, éclairs, deux boudeurs… et un cœur pour se réconcilier */
.pv .pv-nuage { transform-box: fill-box; transform-origin: center; animation: nuage 2.4s ease-in-out infinite; }
@keyframes nuage { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px) rotate(-2deg); } 75% { transform: translateX(4px) rotate(2deg); } }
.pv .pv-eclair { animation: eclair 2.4s steps(1) infinite; }
@keyframes eclair { 0%, 40%, 52%, 60%, 100% { opacity: 0; } 42%, 56% { opacity: 1; } }
.pose-disputes .pv-corps, .pose-disputes .pv-corps-v { transform-origin: 50% 100%; animation: boude 2.4s ease-in-out infinite; }
.pose-disputes .pv-corps-v { animation-delay: .3s; }
@keyframes boude { 0%, 38%, 100% { transform: none; } 44% { transform: translateY(-6px) scale(.96, 1.05); } 52% { transform: scale(1.06, .94); } 60% { transform: none; } }
/* intimité : la bougie vacille, ils rougissent */
.pv .pv-flamme { transform-box: fill-box; transform-origin: 50% 100%; animation: flamme .9s ease-in-out infinite alternate; }
@keyframes flamme { 0% { transform: scale(1, 1) skewX(0); } 33% { transform: scale(.9, 1.1) skewX(-7deg); } 66% { transform: scale(1.06, .94) skewX(6deg); } 100% { transform: scale(.95, 1.07) skewX(-2deg); } }
.pv .pv-halo { transform-box: fill-box; transform-origin: center; animation: halo 1.8s ease-in-out infinite; }
@keyframes halo { 50% { transform: scale(1.2); opacity: .14; } }
.pv .pv-joues { animation: rougit 2.6s ease-in-out infinite; }
@keyframes rougit { 50% { opacity: .5; } }
.pose-intimite .pv-corps, .pose-intimite .pv-corps-v { transform-origin: 50% 100%; animation: berce 3.4s ease-in-out infinite; }
/* distance : un cœur voyage de Point à Virgule, entre le soleil et la lune */
.pv .pv-soleil { transform-box: fill-box; transform-origin: center; animation: tourne 16s linear infinite; }
.pv .pv-lune { transform-box: fill-box; transform-origin: center; animation: balance 4s ease-in-out infinite; }
.pv .pv-voyage { transform: translate(121px, 82px); animation: voyage 3.2s ease-in-out infinite; }
@keyframes voyage { 0% { transform: translate(70px, 150px) scale(.2); opacity: 0; } 8% { transform: translate(78px, 132px) scale(1); opacity: 1; } 25% { transform: translate(95px, 103px) scale(1.1); } 45% { transform: translate(121px, 82px) scale(1.3); } 65% { transform: translate(148px, 86px) scale(1.1); } 82% { transform: translate(176px, 112px) scale(1); opacity: 1; } 90% { transform: translate(180px, 120px) scale(1.7); opacity: 0; } 100% { transform: translate(180px, 120px) scale(.2); opacity: 0; } }
.pose-distance .pv-corps { transform-origin: 50% 100%; animation: envoie 3.2s ease-in-out infinite; }
@keyframes envoie { 0%, 16%, 100% { transform: none; } 4% { transform: translateY(-7px) scale(.96, 1.05); } 10% { transform: scale(1.05, .95); } }
.pose-distance .pv-corps-v { animation: recoit 3.2s ease-in-out infinite; }
@keyframes recoit { 0%, 80%, 97%, 100% { transform: rotate(0); } 86% { transform: translateY(-7px) rotate(-9deg); } 92% { transform: rotate(5deg); } }
/* rire : fou rire, larmes et points d'exclamation */
.pose-rire .pv-corps, .pose-rire .pv-corps-v { transform-origin: 50% 100%; animation: rire 1.6s ease-in-out infinite; }
.pose-rire .pv-corps-v { animation-delay: .12s; }
@keyframes rire { 0%, 56%, 100% { transform: none; } 5%, 15%, 25%, 35%, 45% { transform: translateY(-4px) rotate(-3deg); } 10%, 20%, 30%, 40%, 50% { transform: translateY(1px) rotate(3deg); } }
.pv .pv-larme { transform-box: fill-box; transform-origin: center; animation: larme 1.6s ease-out infinite; animation-delay: var(--d, 0s); }
@keyframes larme { 0%, 8% { transform: translate(0, 0) scale(.3); opacity: 0; } 18% { opacity: 1; transform: translate(calc(var(--x) * .3), -5px) scale(1); } 60% { transform: translate(var(--x), 10px); opacity: 1; } 76%, 100% { opacity: 0; transform: translate(var(--x), 18px); } }
.pv .pv-ha { transform-box: fill-box; transform-origin: 50% 100%; animation: ha 1.6s cubic-bezier(.34, 1.5, .64, 1) infinite; }
.pv .pv-ha2 { animation-delay: .18s; }
.pv .pv-ha3 { animation-delay: .36s; }
@keyframes ha { 0%, 62%, 100% { transform: scale(0); opacity: 0; } 10%, 48% { transform: scale(1) rotate(-8deg); opacity: 1; } 26% { transform: scale(1.12) rotate(8deg); } }
/* parents : le bébé point rebondit entre eux */
.pv .pv-bebe { transform-box: fill-box; transform-origin: 50% 100%; animation: bebe 1.1s infinite; }
@keyframes bebe { 0%, 100% { transform: translateY(0) scale(1.08, .92); animation-timing-function: cubic-bezier(.2, .7, .4, 1); } 45% { transform: translateY(-17px) scale(.95, 1.05); animation-timing-function: cubic-bezier(.6, 0, .8, .4); } 72% { transform: translateY(0) scale(1.07, .93); } }
.pose-parents .pv-corps, .pose-parents .pv-corps-v { transform-origin: 50% 100%; animation: berce 2.6s ease-in-out infinite; }
.pose-souvenirs .pv-corps, .pose-avenir .pv-corps { animation-duration: 2.6s; }

/* ================= chargement : le point plonge dans la virgule, ils se mélangent ================= */
.melange { display: block; overflow: visible; }
.melange .lm-vp { fill: #E1243B; animation: lmCouleurV 2.2s ease-in-out infinite; }
.melange .lm-pp { fill: #1F2FA8; animation: lmCouleurP 2.2s ease-in-out infinite; }
.melange .lm-pt { transform-origin: 0px -48.5px; animation: lmPoint 2.2s infinite; }
.melange .lm-v { transform-origin: 0px -15px; animation: lmVirgule 2.2s infinite; }
@keyframes lmPoint {
  0% { transform: translateY(-5px); animation-timing-function: cubic-bezier(.3, 0, .6, 1); }
  10% { transform: translateY(-12px) scale(.94, 1.06); animation-timing-function: cubic-bezier(.6, 0, .9, .5); }
  26% { transform: translateY(33.5px) scale(1.08, .92); }
  34%, 58% { transform: translateY(33.5px) scale(.8); animation-timing-function: cubic-bezier(.2, .6, .3, 1); }
  70% { transform: translateY(-14px) scale(.9, 1.14); animation-timing-function: ease-in; }
  78% { transform: translateY(-5px) scale(1.1, .9); }
  86%, 100% { transform: translateY(-5px) scale(1); }
}
@keyframes lmVirgule {
  0%, 22% { transform: none; }
  28% { transform: scale(1.12, .88); animation-timing-function: cubic-bezier(.4, 0, .2, 1); }
  34% { transform: scale(1.06) rotate(0); animation-timing-function: cubic-bezier(.5, 0, .3, 1); }
  60% { transform: scale(1.06) rotate(360deg); }
  70% { transform: scale(.94, 1.06) rotate(360deg); }
  80% { transform: rotate(354deg); }
  90%, 100% { transform: rotate(360deg); }
}
@keyframes lmCouleurV { 0%, 20%, 66%, 100% { fill: #E1243B; } 31%, 56% { fill: #7E2A78; } }
@keyframes lmCouleurP { 0%, 20%, 66%, 100% { fill: #1F2FA8; } 31%, 56% { fill: #7E2A78; } }

.charge { position: absolute; inset: 0; z-index: 45; background: var(--papier); display: grid; place-content: center; justify-items: center; gap: 22px; padding: 24px; text-align: center; animation: inF .25s ease both; }
.charge p { margin: 0; max-width: 260px; font: 400 21px/27px var(--font-display); color: var(--graphite); text-wrap: balance; animation: monte .5s .15s cubic-bezier(.2, .8, .2, 1) both; }
.charge.sort { animation: outF .4s ease both; }
.fond-bleu .melange, .ill .melange { margin: 0 auto; }

/* ================= l'app (V2) ================= */
.scr.app { padding-top: 50px; }
.scr.app .sc { padding: 6px 20px 110px; gap: 16px; }
@media (max-width: 520px) { .scr.app { padding-top: env(safe-area-inset-top, 0px); } .scr.app .sc { padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); } }

/* barre d'onglets */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 8px 30px; background: color-mix(in srgb, var(--craie) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--filet); }
@media (max-width: 520px) { .tabbar { padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); } }
.tabbar button { border: 0; background: transparent; display: grid; justify-items: center; gap: 3px; padding: 6px 0; font: 700 11px/14px var(--font-sans); color: var(--graphite-doux); cursor: pointer; position: relative; }
.tabbar button svg { display: block; }
.tabbar button[aria-current="page"] { color: var(--graphite); }
.tabbar button[aria-current="page"]::after { content: ""; position: absolute; top: -8px; width: 22px; height: 4px; border-radius: 0 0 4px 4px; background: var(--rouge); }

/* en-tête d'onglet */
.ahead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.ahead .droite { display: flex; gap: 8px; align-items: center; }
.gel { display: inline-flex; align-items: center; gap: 4px; background: var(--bleu-pale); color: var(--bleu); border-radius: 999px; padding: 4px 10px; font: 800 13px/18px var(--font-sans); }
.salut-t { margin: 4px 0 0; font: 400 30px/34px var(--font-display); text-wrap: balance; }
.salut-s { margin: -8px 0 0; font-size: 14.5px; color: var(--graphite-doux); }
.sec { display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px; }
.sec h2 { margin: 0; font: 800 12px/16px var(--font-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--graphite-doux); }
.sec button { border: 0; background: transparent; font: 700 13.5px/1 var(--font-sans); color: var(--bleu); cursor: pointer; }

/* cartes de la liste du jour */
.carte { width: 100%; text-align: left; border: 0; background: var(--craie); border-radius: 22px; box-shadow: var(--ombre-billet); padding: 14px 16px; display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; cursor: pointer; color: var(--graphite); position: relative; transition: transform .15s ease; }
.carte:active { transform: scale(.985); }
.carte .vis { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; overflow: hidden; }
.carte b { display: block; font: 700 16px/21px var(--font-sans); }
.carte small { display: block; font-size: 13.5px; line-height: 18px; color: var(--graphite-doux); margin-top: 2px; }
.etat { font: 800 11px/1 var(--font-sans); letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 6px 9px; white-space: nowrap; }
.etat.fait { background: var(--bleu-pale); color: var(--bleu); }
.etat.afaire { background: var(--rouge); color: var(--on-rouge); }
.etat.prem { background: var(--beurre); color: var(--on-beurre); }
.etat.att { background: var(--filet); color: var(--graphite-doux); }

/* Aujourd'hui : hiérarchie */
.salut { display: grid; gap: 2px; }
.salut .salut-s { margin: 0; }
.serie { display: inline-flex; align-items: center; gap: 5px; border: 0; background: var(--beurre); color: var(--on-beurre); border-radius: 999px; padding: 6px 12px 6px 10px; font: 800 13.5px/18px var(--font-sans); cursor: pointer; }
.qdj { background: var(--bleu); color: var(--on-bleu); border-radius: 30px; padding: 20px 18px 18px; display: grid; gap: 14px; position: relative; overflow: hidden; box-shadow: 0 14px 30px -14px rgba(31, 47, 168, .55); }
.qdj > *:not(.ambiance) { position: relative; z-index: 1; }
.qdj .k { font: 800 11.5px/14px var(--font-sans); letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.qdj .q { margin: -4px 0 0; font: 400 25px/30px var(--font-display); text-wrap: balance; }
.qdj-bas { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin: -2px 0 -6px; }
.qui { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.qui li { display: flex; align-items: center; gap: 8px; font: 600 14px/18px var(--font-sans); }
.qui .pc { width: 22px; height: 22px; border-radius: 50%; flex: none; display: grid; place-items: center; border: 2px dashed color-mix(in srgb, var(--on-bleu) 60%, transparent); }
.qui .fait .pc { border: 0; background: var(--beurre); color: var(--on-beurre); }
.qui li:not(.fait) { opacity: .92; }
.qdj-bas .pv-wrap { flex: none; margin-right: -6px; }
.btn-beurre { background: var(--beurre); color: var(--on-beurre); min-height: 52px; }
.nouv { background: var(--craie); border-radius: 24px; box-shadow: var(--ombre-billet); padding: 14px 16px 6px; display: grid; gap: 12px; }
.nv-h { display: flex; align-items: center; gap: 12px; }
.nv-h p { margin: 0; font-size: 15.5px; line-height: 21px; }
.nouv .billet { margin: 0 2px; }
.nv-act { border: 0; border-top: 1px solid var(--filet); background: transparent; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 0 10px; font: 700 14.5px/20px var(--font-sans); color: var(--rouge-texte); cursor: pointer; }
.nv-act svg { color: var(--rouge); }
.h-ok { margin: 0; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13.5px; color: var(--graphite-doux); }
.h-ok svg { color: var(--succes, #1A7F4B); }
.minis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mini { border: 0; background: var(--craie); border-radius: 22px; box-shadow: var(--ombre-billet); padding: 14px; display: grid; gap: 2px; align-content: start; justify-items: start; text-align: left; cursor: pointer; position: relative; color: var(--graphite); transition: transform .15s; }
.mini:active, .bandeau-a:active { transform: scale(.97); }
.mini .mv { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; margin-bottom: 8px; background: var(--papier); }
.mini .mv-q { background: var(--bleu-pale); }
.mini b { font: 700 15.5px/20px var(--font-sans); }
.mini small { display: flex; align-items: center; gap: 4px; font-size: 13px; line-height: 17px; color: var(--graphite-doux); }
.mini small svg { color: var(--succes, #1A7F4B); }
.mini-c { position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 50%; background: var(--beurre); color: var(--on-beurre); display: grid; place-items: center; }
.pastille { position: absolute; top: 14px; right: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--rouge); box-shadow: 0 0 0 3px var(--craie); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.25); } }
.ligne .vis > span { display: inline-block; animation: bobine 2.6s cubic-bezier(.34, 1.4, .64, 1) infinite; }
@keyframes bobine { 0%, 60%, 100% { transform: none; } 15% { transform: translateY(-5px) rotate(-10deg); } 32% { transform: rotate(6deg); } 45% { transform: none; } }
.ligne:nth-child(2) .vis > span { animation-delay: .5s; }
.ligne:nth-child(3) .vis > span { animation-delay: 1s; }
.bandeau-a { width: 100%; border: 0; background: var(--bleu-pale); color: var(--graphite); border-radius: 22px; padding: 8px 14px 8px 8px; display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; text-align: left; cursor: pointer; transition: transform .15s; }
.bandeau-a b { display: block; font: 700 15.5px/20px var(--font-sans); }
.bandeau-a small { font-size: 13px; line-height: 17px; color: var(--graphite-doux); }
.bandeau-a > svg { color: var(--graphite-doux); transform: rotate(180deg); }

/* statut du duo */
.duo { background: var(--bleu); color: var(--on-bleu); border-radius: 24px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; }
.duo p { margin: 0; font: 600 15px/21px var(--font-sans); position: relative; z-index: 1; }
.duo .pv-wrap { position: relative; z-index: 1; flex: none; }

/* humeur */
.humeur { background: var(--craie); border-radius: 22px; box-shadow: var(--ombre-billet); padding: 14px 16px 16px; display: grid; gap: 12px; }
.humeur .h-t { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.humeur .h-t b { font: 700 16px/21px var(--font-sans); }
.moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.moods button { border: 0; background: transparent; display: grid; justify-items: center; gap: 4px; padding: 6px 0; border-radius: 14px; cursor: pointer; font: 600 11px/13px var(--font-sans); color: var(--graphite-doux); transition: background-color .2s, transform .2s; }
.moods button svg { transition: transform .3s cubic-bezier(.34, 1.6, .64, 1); }
.moods button[aria-pressed="true"] { background: var(--buvard); color: var(--graphite); }
.moods button[aria-pressed="true"] svg { transform: scale(1.18) rotate(-6deg); }
.humeur .lui { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--graphite-doux); border-top: 1px dashed var(--filet); padding-top: 10px; }
.humeur .lui b { color: var(--graphite); }

/* mot doux reçu */
.recu { display: grid; gap: 10px; }
.recu .billet { cursor: pointer; }

/* explorer */
.recherche { position: relative; }
.recherche svg { position: absolute; left: 16px; top: 50%; margin-top: -9px; color: var(--graphite-doux); }
.recherche .in { padding-left: 46px; height: 50px; font-size: 16px; border-radius: 999px; border-color: var(--filet); }

    setTimeout(function () { S.missionOuverte = true; sauver(); A.mission = true; rafraichir(); A.mission = false; }, 720);
  };
  ACT['mission-faite'] = function () { S.missionFaite = true; sauver(); rafraichir(); confettis(60); };
  ACT.jeu = function () { aller('jeu'); };
  ACT['jeu-autre'] = function () { toast('Dans ce prototype, seul « Toi ou moi ? » est jouable.', 2400); };
  ACT['jeu-rep'] = function (el) {
    anime(el.querySelector('.pv'), 'hop');
    S.jeuR.push(el.getAttribute('data-val')); S.jeuI++; sauver();
    setTimeout(function () {
      rafraichir();
      if (S.jeuI >= TOM.length) { var sc = 0; S.jeuR.forEach(function (r, k) { if (r === TOM[k][1]) sc++; }); if (sc >= 3) confettis(60); }
    }, 260);
  };
  ACT['jeu-rejouer'] = function () { S.jeuI = 0; S.jeuR = []; sauver(); rafraichir(); };
  ACT.bilan = function () { if (!premium()) return aller('bilan'); chargement('On relit votre semaine à deux…', 1700, function () { aller('bilan'); }); };
  ACT.pack = function (el) { S.packId = el.getAttribute('data-val'); sauver(); anime(el.querySelector('.pv-wrap'), 'hop'); setTimeout(function () { aller('pack'); }, 220); };
  ACT['pack-q'] = function (el) { feuillePQ(+el.getAttribute('data-val')); };
  ACT['envoyer-pq'] = function (el) {
    var i = +el.getAttribute('data-val'), t = phone.querySelector('#f-pq'), v = t ? t.value.trim() : '', p = partNom();
    if (v.length < 2) { if (t) t.focus(); return; }
    var cle = S.packId + '-' + i; S.packRep = S.packRep || {}; S.packTxt = S.packTxt || {};
    S.packRep[cle] = 'envoye'; S.packTxt[cle] = v; sauver(); fermerOverlays(); rafraichir();
    toast('Envoyée. Elle s’ouvrira quand ' + p + ' aura répondu.', 2200);
    setTimeout(function () { // dans le prototype, l'autre répond quelques secondes plus tard
      if (S.packRep[cle] !== 'envoye') return;
      S.packRep[cle] = 'ouvert'; sauver(); banniere(p + ' a répondu. Vos deux réponses sont ouvertes' + NBSP + ';');
      if (S.ecran === 'pack') rafraichir();
    }, 4200);
  };
  ACT.parcours = function (el) { S.parcI = +el.getAttribute('data-val'); sauver(); anime(el.querySelector('.pv-wrap'), 'hop'); setTimeout(function () { aller('parcours-d'); }, 220); };
  ACT['parcours-go'] = function () { toast('Jour 1 lancé. ' + partNom() + ' le reçoit aussi.', 2400); };
  ACT.filtre = function (el) { S.filtre = el.getAttribute('data-val'); sauver(); rafraichir(); };
  ACT.souvenir = function () { toast('Ajouter un souvenir : photo, lieu et date, dans la vraie app.', 2400); };
  ACT.reglage = function () { toast('Les réglages ne sont pas simulés dans ce prototype.', 2000); };
  ACT.debloquer = function () { S.retourApp = true; sauver(); aller('paywall'); };

  /* ================= panneau (bureau) ================= */
  var panneau = $('#panel');
  function majPanneau() {
    if (!panneau) return;
    $('#why-t', panneau).textContent = NOMS[S.ecran] || '';
    $('#why-p', panneau).textContent = POURQUOI[S.ecran] || '';
    var p = parcours(), html = '', ph = '';
    p.forEach(function (id) {
      if (PHASES[id] !== ph) { ph = PHASES[id]; html += '<li class="ph">' + ph + '</li>'; }
      html += '<li><button class="' + (S.vus[id] ? 'vu' : '') + '" data-saut="' + id + '"' + (id === S.ecran ? ' aria-current="step"' : '') + '><i></i>' + NOMS[id] + '</button></li>';
    });
    $('#steps', panneau).innerHTML = html;
    panneau.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-mode') === S.mode); });
    panneau.querySelectorAll('[data-version]').forEach(function (b) { b.setAttribute('aria-pressed', String((b.getAttribute('data-version') === 'premium') === !!S.abonne)); });
  }
  if (panneau) panneau.addEventListener('click', function (ev) {
    var s = ev.target.closest('[data-saut]');
    if (s) { var id = s.getAttribute('data-saut'); remplirDemo(id); aller(id, 'fondu'); return; }
    var m = ev.target.closest('[data-mode]'); if (m) { reset(m.getAttribute('data-mode')); return; }
    var v = ev.target.closest('[data-version]'); if (v) { version(v.getAttribute('data-version')); return; }
    if (ev.target.closest('#recommencer')) reset(S.mode);
    if (ev.target.closest('#theme')) { var r = document.documentElement, sombre = r.getAttribute('data-theme') === 'dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches); r.setAttribute('data-theme', sombre ? 'light' : 'dark'); }
  });
  // bascule le prototype en version gratuite ou Premium, et ouvre l'app si on n'y est pas encore
  function version(v) {
    remplirDemo('app-aujourdhui');
    if (v === 'premium') { S.abonne = 'abonne'; if (!S.envoye) { S.reponse = S.reponse || 'Quand tu chantes faux sous la douche.'; S.envoye = true; S.partenaireRepondu = true; S.revele = true; } }
    else S.abonne = null;
    S.retourApp = false; sauver();
    if (APP.concat(DETAILS).indexOf(S.ecran) < 0) { S.pile = []; aller('app-aujourdhui', 'fondu'); } else { rafraichir(); majPanneau(); }
    toast(v === 'premium' ? 'Version Premium : tout est débloqué, pour vous deux.' : 'Version gratuite : la question du jour, Souvenirs et Pour rire.', 2400);
  }
  function remplirDemo(id) { // un saut direct dans le parcours a besoin de valeurs plausibles
    if (!S.prenom) S.prenom = S.mode === 'partenaire' ? 'Thomas' : 'Léa';
    if (!S.pronom) S.pronom = S.mode === 'partenaire' ? 'il' : 'elle';
    if (!S.partenaire) S.partenaire = S.mode === 'partenaire' ? 'Léa' : 'Thomas';
    if (!S.pronomP) S.pronomP = S.mode === 'partenaire' ? 'elle' : 'il';
    if (!S.email) S.email = 'lea@exemple.fr';
    if (!S.depuisA) { S.depuisA = String(new Date().getFullYear() - 6); S.depuisM = '8'; }
    if (!S.objectifs.length) S.objectifs = ['complicite', 'rire'];
    S.consent = true; sauver();
  }

  /* ================= mise à l'échelle du téléphone ================= */
  var dev = $('.device');
  function echelle() {
    if (innerWidth <= 520) { dev.style.transform = ''; return; }
    var s = Math.min(1, (innerHeight - 40) / 868, (innerWidth - 32) / 414);
    dev.style.transform = s < 1 ? 'scale(' + s.toFixed(3) + ')' : '';
    dev.style.margin = s < 1 ? ((844 * (s - 1)) / 2) + 'px ' + ((390 * (s - 1)) / 2) + 'px' : '';
  }
  addEventListener('resize', echelle); echelle();
  if (location.hash === '#premium' || location.hash === '#gratuit') setTimeout(function () { version(location.hash.slice(1)); }, 300);

  aller(E[S.ecran] ? S.ecran : 'accueil', 'fondu');
})();
