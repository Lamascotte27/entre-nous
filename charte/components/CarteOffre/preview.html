<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Aperçu</title></head>
<body>
<div id="root" class="en-demo"></div>
<script>
  var E = window.EntreNous, h = React.createElement;
  function Demo() {
    var s = React.useState('an'), choix = s[0], setChoix = s[1];
    return h('div', { style: { display: 'grid', gap: '18px', width: '360px', paddingTop: '8px' } },
      h(E.CarteOffre, { titre: 'Annuel', detail: '7 jours gratuits, puis 59,99 € par an', prix: '2,50 €', mention: 'par personne et par mois', etiquette: 'Le plus choisi', choisie: choix === 'an', onClick: function () { setChoix('an'); } }),
      h(E.CarteOffre, { titre: 'Mensuel', detail: 'Sans engagement', prix: '14,99 €', mention: 'par mois pour vous deux', choisie: choix === 'mois', onClick: function () { setChoix('mois'); } }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
