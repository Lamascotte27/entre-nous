<path d="M328.6,87.8 A150,150 0 0 1 431.2,162.3" fill="none" stroke="var(--ink-3)" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M448.9,216.7 A150,150 0 0 1 409.7,337.3" fill="none" stroke="var(--ink-3)" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M363.4,370.9 A150,150 0 0 1 236.6,370.9" fill="none" stroke="var(--ink-3)" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M190.3,337.3 A150,150 0 0 1 151.1,216.7" fill="none" stroke="var(--ink-3)" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M168.8,162.3 A150,150 0 0 1 271.4,87.8" fill="none" stroke="var(--rouge)" stroke-width="2" marker-end="url(#ahr)"/>
<circle cx="300.0" cy="85.0" r="10" fill="var(--bleu)" stroke="var(--paper)" stroke-width="2"/>
<circle cx="442.7" cy="188.6" r="10" fill="var(--rouge)" stroke="var(--paper)" stroke-width="2"/>
<circle cx="388.2" cy="356.4" r="10" fill="var(--rouge)" stroke="var(--paper)" stroke-width="2"/>
<circle cx="206.8" cy="356.4" r="9" fill="var(--bleu)" stroke="var(--paper)" stroke-width="2"/><circle cx="216.8" cy="356.4" r="9" fill="var(--rouge)" stroke="var(--paper)" stroke-width="2"/>
<circle cx="152.3" cy="188.6" r="9" fill="var(--bleu)" stroke="var(--paper)" stroke-width="2"/><circle cx="162.3" cy="188.6" r="9" fill="var(--rouge)" stroke="var(--paper)" stroke-width="2"/>
<text x="300.0" y="41.0" text-anchor="middle" style="font-size:15px;font-weight:600"><tspan x="300.0" dy="0">Notification</tspan><tspan x="300.0" dy="19">« Thomas a répondu »</tspan></text>
<text x="462.7" y="184.6" text-anchor="start" style="font-size:15px;font-weight:600"><tspan x="462.7" dy="0">J'ouvre l'app</tspan></text>
<text x="404.2" y="384.4" text-anchor="start" style="font-size:15px;font-weight:600"><tspan x="404.2" dy="0">Je réponds</tspan><tspan x="404.2" dy="19">à mon tour</tspan></text>
<text x="195.8" y="384.4" text-anchor="end" style="font-size:15px;font-weight:600"><tspan x="195.8" dy="0">Les deux réponses</tspan><tspan x="195.8" dy="19">se dévoilent</tspan></text>
<text x="135.3" y="184.6" text-anchor="end" style="font-size:15px;font-weight:600"><tspan x="135.3" dy="0">On en parle,</tspan><tspan x="135.3" dy="19">pour de vrai</tspan></text>
<text x="164.6" y="130.8" text-anchor="end" style="font-size:13px;fill:var(--rouge);font-weight:600">le lendemain, série +1</text>
<text x="300" y="233" text-anchor="middle" style="font-family:var(--f-display);font-size:46px">2 min</text>
<text x="300" y="259" text-anchor="middle" style="font-size:13px;fill:var(--ink-3)">par jour, à deux</text>
</svg>